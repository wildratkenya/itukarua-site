name: Corporate Monthly Billing & Digest
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  bill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger corporate-monthly-billing edge function
        run: |
          curl -sS -f -w "\nHTTP %{http_code}\n" -X POST https://xahaxtbudiubelemewna.supabase.co/functions/v1/corporate-monthly-billing \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"