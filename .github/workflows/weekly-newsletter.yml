name: Weekly Newsletter
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter edge function
        run: |
          curl -s -X POST https://xahaxtbudiubelemewna.supabase.co/functions/v1/send-weekly-newsletter \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
